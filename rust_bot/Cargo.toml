[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[dependencies]
azalea = { git = "https://github.com/azalea-rs/azalea", version = "0.16.0" }
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
eyre = "0.6"
serde_json = "1.0"

[profile.dev]
codegen-units = 1
incremental = false
split-debuginfo = "off"